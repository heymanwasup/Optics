[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fourier-optics"
version = "0.1.0"
description = "Fourier optics field simulation and Hopkins imaging model."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/fourier_optics"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
